name: ci
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build: false
      - name: Build library and tests (log kept)
        shell: bash
        run: |
          set -euo pipefail
          lake exe cache get || true
          lake build 2>&1 | tee build.log
          lake build Tests 2>&1 | tee -a build.log
      - name: Committed manifest must be sufficient (lake must not rewrite it)
        run: git diff --exit-code lake-manifest.json
      - name: Axiom audit (no sorry, no native_decide, only standard axioms)
        shell: bash
        run: |
          set -euo pipefail
          if grep -E "sorryAx|ofReduceBool|Lean.trustCompiler" build.log; then
            echo "forbidden axiom found"; exit 1
          fi
          # every reported axiom list must be a subset of the three standard axioms
          if grep "depends on axioms" build.log | grep -v -E "axioms: \[(propext|Classical\.choice|Quot\.sound)(, (propext|Classical\.choice|Quot\.sound))*\]$"; then
            echo "non-standard axiom list"; exit 1
          fi
          want=$(grep -c "^#print axioms" Tests.lean)
          got=$(grep -c -E "depends on axioms|does not depend on any axioms" build.log)
          echo "audited declarations: expected >= $want, reported $got"
          test "$got" -ge "$want"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log

  mathlib-inspect:   # Stage-1 evidence: print real signatures of reused / related Mathlib results
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build: false
      - run: lake exe cache get || true
      - name: Signatures
        run: |
          cat > Inspect.lean <<'EOF'
          import Mathlib
          open Matrix
          #check @Matrix.mulVec_mulVec
          #check @Matrix.dotProduct_mulVec
          #check @LinearMap.finrank_range_add_finrank_ker
          #check @LinearMap.finrank_range_of_inj
          #check @Set.exists_max_image
          #check @Set.exists_min_image
          #check @Fin.snoc_castSucc
          #check @PointedCone.DualFG
          EOF
          lake env lean Inspect.lean
          grep -rli "farkas\|motzkin" .lake/packages/mathlib/Mathlib | head || true
